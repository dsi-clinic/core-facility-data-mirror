repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.6  # Use the same version as in your pyproject.toml
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format

# Optional but recommended additional hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-toml
